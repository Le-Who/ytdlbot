services:
  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_LOCAL_ENDPOINT=http://tg-api:8081
      - POT_PROVIDER_URL=http://bgutil-pot:4416
    # Убрали public port 8000. Внешний мир попадает сюда только через Caddy
    depends_on:
      redis:
        condition: service_healthy
      tg-api:
        condition: service_started
      bgutil-pot:
        condition: service_started
    volumes:
      - bot_cache:/home/botuser/.cache/yt-dlp
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: "3.5"

  # YouTube POT (Proof-of-Origin Token) server — generates tokens to bypass
  # "Sign in to confirm you're not a bot" checks. Eliminates need for YouTube cookies.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  tg-api:
    image: aiogram/telegram-bot-api:latest
    restart: always
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Прокси-сервер для автоматического HTTPS и маршрутизации на домен
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from https://vid.tri.mom --to http://bot:8000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

  # Управление контейнерами (Web-интерфейс)
  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - "9000:9000"     # Доступ по HTTP: http://твои_ip:9000
      - "9443:9443"     # Доступ по HTTPS (self-signed): https://твои_ip:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  tg-api-data:
  redis-data:
  caddy_data:
  caddy_config:
  portainer_data:
  bot_cache:
