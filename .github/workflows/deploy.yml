name: Deploy to VPS

on:
  push:
    branches:
      - vps
jobs:
  deploy:
    runs-on: ubuntu-latest

    # Рекомендуется использовать environment для защиты секретов
    environment: production

    steps:
      - name: Execute deployment script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            # 1. Переходим в рабочую директорию бота (должна быть заранее создана и склонирована!)
            # Измени путь, если репозиторий лежит в другом месте
            cd /opt/ytdlbot || exit 1

            # 2. Подтягиваем актуальный код (жёстко приравниваем к ветке vps, удаляя локальные конфликты)
            git fetch origin vps
            git checkout vps || git checkout -b vps origin/vps
            git reset --hard origin/vps

            # 3. Перезаписываем .env файл
            cat << 'EOF' > .env
            # === СЕКРЕТЫ ИЗ GITHUB ACTIONS ===
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
            TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            ADMIN_CHAT_ID=${{ secrets.ADMIN_CHAT_ID }}
            
            # Платформенные куки (оставь пустыми в GitHub Secrets, если не используешь)
            YTDLP_COOKIES_B64=${{ secrets.YTDLP_COOKIES_B64 }}
            FACEBOOK_COOKIES_B64=${{ secrets.FACEBOOK_COOKIES_B64 }}
            TIKTOK_COOKIES_B64=${{ secrets.TIKTOK_COOKIES_B64 }}
            VK_COOKIES_B64=${{ secrets.VK_COOKIES_B64 }}
            IG_SESSIONS_B64=${{ secrets.IG_SESSIONS_B64 }}
            
            # === ФИКСИРОВАННЫЕ НАСТРОЙКИ Сервера ===
            BASE_URL=https://vid.tri.mom
            TZ=Europe/Kyiv
            # WEBHOOK_URL указывает локальному TG API куда слать апдейты.
            # Если указать внешний домен — пакеты могут умереть на NAT loopback сервера.
            # Указываем внутреннее имя контейнера бота в сети Docker!
            WEBHOOK_URL=http://bot:8000
            TELEGRAM_SECRET_TOKEN=133769
            # REDIS_URL убран — Docker Compose сам подключится к своему внутреннему Redis
            # TELEGRAM_LOCAL_ENDPOINT убран — Docker Compose сам его выставляет
            
            # --- Настройки скачивания/загрузки ---
            ENABLE_TELEGRAM_UPLOAD=1
            MAX_TG_UPLOAD_MB=900
            MAX_DL_MB=1000
            MAX_CONCURRENT_TASKS=4
            MAX_API_TASKS=20
            YTDLP_CONCURRENT_FRAGMENTS=10
            DL_TIMEOUT_TELEGRAM=1200
            DL_TIMEOUT_HTTP=1800
            YOUTUBE_PIPE_MODE=0
            
            # --- Очистка и система ---
            TMPDIR=/tmp
            MAX_TEMP_AGE_SECONDS=3600
            JANITOR_INTERVAL_SECONDS=300
            
            # --- Лимиты ---
            LIMITER_USER_CAPACITY=5
            LIMITER_USER_REFILL_PER_SEC=0.5
            LIMITER_CHAT_CAPACITY=20
            LIMITER_CHAT_REFILL_PER_SEC=1
            LIMITER_IP_CAPACITY=15
            LIMITER_IP_REFILL_PER_SEC=1
            LIMITER_TOKEN_CAPACITY=3
            LIMITER_TOKEN_REFILL_PER_SEC=0.25
            LIMITER_IG_CAPACITY=15
            
            # --- Внешние API ---
            COBALT_API_URL=https://api.cobalt.tools
            ENABLE_COBALT_TIKTOK=0
            EOF

            # 4. Пересобираем контейнер бота (меняются зависимости) и перезапускаем весь стек
            docker compose build bot
            docker compose down
            docker compose up -d
