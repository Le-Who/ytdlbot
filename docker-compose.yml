services:
  bot:
    # Образ собирается в GitHub Actions и публикуется в GHCR.
    # На VPS только docker pull — никакой локальной сборки.
    image: ghcr.io/${GHCR_REPO}:latest
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_LOCAL_ENDPOINT=http://tg-api:8081
      - POT_PROVIDER_URL=http://bgutil-pot:4416
    # Хостовый Caddy проксирует vid.tri.mom → 127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      tg-api:
        condition: service_started
      bgutil-pot:
        condition: service_started
    volumes:
      - bot_cache:/home/botuser/.cache/yt-dlp
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.4"

  # YouTube POT (Proof-of-Origin Token) server — generates tokens to bypass
  # "Sign in to confirm you're not a bot" checks. Eliminates need for YouTube cookies.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"

  tg-api:
    image: aiogram/telegram-bot-api:latest
    restart: always
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api
    # Порт не публикуется наружу — bot обращается по имени сервиса внутри сети
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.4"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    # Порт не публикуется наружу — используется только внутри compose-сети
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tg-api-data:
  redis-data:
  bot_cache:
