services:
  wireguard-proxy:
    build:
      context: ./examples/wireguard
    container_name: wireguard-proxy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./wireguard:/config
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 | grep -q 'latest handshake'"]
      interval: 30s
      timeout: 10s
      retries: 3
