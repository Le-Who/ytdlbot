name: Media Acceptance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_diagnostics:
        description: Run network diagnostics from the GitHub runner (not production-IP acceptance)
        required: false
        type: boolean
        default: false

jobs:
  integration:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test_token
      WEBHOOK_URL: https://example.com
      TELEGRAM_SECRET_TOKEN: test_secret_token
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install pinned Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Run offline acceptance
        run: python -m pytest tests/acceptance/test_media_release.py --no-cov -q

      - name: Run opt-in network diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_diagnostics }}
        run: |
          echo "::warning::This GitHub-runner diagnostic is not production-IP release evidence."
          python -m pytest tests/test_integration_real.py -m integration --no-cov -v
