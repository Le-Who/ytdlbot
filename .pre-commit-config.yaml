minimum_pre_commit_version: "4.6.2"

repos:
  # Ruff: lint + format (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy: type checking
  # Run in the activated project environment: mypy needs the same typed
  # runtime dependencies as CI, rather than an isolated hook environment.
  # Tool versions are pinned in requirements-ci.txt.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        language: system
        types: [python]
        pass_filenames: false
        entry: python -m mypy app/ --no-incremental

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
