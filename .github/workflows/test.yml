name: Tests

on:
  push:
    branches: [main, develop, vps]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          BOT_TOKEN: test_token
          WEBHOOK_URL: https://example.com
          TELEGRAM_SECRET_TOKEN: ci-secret
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v --tb=short

      - name: Validate immutable release contracts
        env:
          APP_RELEASE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOT_IMAGE: ghcr.io/example/ytdlbot@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: test
        run: |
          bash -n scripts/deploy-release.sh scripts/preflight-production.sh scripts/rollback-release.sh
          docker compose config --quiet
          python -m pytest tests/deploy/test_release_scripts.py --no-cov -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
