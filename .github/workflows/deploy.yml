name: Verify and Deploy Immutable Release

on:
  push:
    branches:
      - vps

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify exact release SHA
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Run full test and release contract gates
        env:
          BOT_TOKEN: test_token
          WEBHOOK_URL: https://example.com
          TELEGRAM_SECRET_TOKEN: ci-secret
          REDIS_URL: redis://localhost:6379/0
          APP_RELEASE: ${{ github.sha }}
          BOT_IMAGE: ghcr.io/example/ytdlbot@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: test
        run: |
          python -m pytest tests -q
          python -m pytest tests/deploy/test_release_scripts.py --no-cov -q
          bash -n scripts/bootstrap-production.sh scripts/bootstrap-migrate-production.sh scripts/deploy-release.sh scripts/preflight-production.sh scripts/rollback-release.sh
          docker compose config --quiet

  build:
    name: Build once and publish SHA image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the tested SHA once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}

      - name: Smoke immutable built image
        env:
          SMOKE_IMAGE: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$SMOKE_IMAGE"
          docker run --rm --entrypoint python "$SMOKE_IMAGE" -c 'import asyncio; from app.api.routes import health_live; assert asyncio.run(health_live()) == {"ok": True}'
          docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$SMOKE_IMAGE" | grep -F '/health/ready'

  deploy:
    name: Activate bot by immutable digest
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ytdlbot-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT || 'ytdlbot' }}
      PROJECT_ROOT: ${{ vars.VPS_PROJECT_PATH || '/opt/ytdlbot' }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || secrets.BASE_URL }}
      BOT_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      DEPLOY_UPLOAD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recheck vps branch freshness
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/vps" --jq '.object.sha')"
          test -n "$branch_sha"
          echo "branch_sha=$branch_sha" >> "$GITHUB_OUTPUT"
          if [[ "$branch_sha" == "$GITHUB_SHA" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale release $GITHUB_SHA; vps is now $branch_sha."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate protected deployment inputs
        if: steps.freshness.outputs.should_deploy == 'true'
        shell: bash
        env:
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$PROJECT_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$PROJECT_ROOT" != "/" && "$PROJECT_ROOT" != *"//"* ]]
          [[ "$COMPOSE_PROJECT" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$PUBLIC_BASE_URL" =~ ^https://[^/[:space:]]+$ ]]
          [[ "$BOT_IMAGE" =~ ^[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$VPS_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]

      - name: Assemble allowlisted release payload
        if: steps.freshness.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-payload/scripts
          install -m 0644 docker-compose.yml release-payload/docker-compose.yml
          install -m 0755 scripts/bootstrap-migrate-production.sh release-payload/scripts/bootstrap-migrate-production.sh
          install -m 0755 scripts/bootstrap-production.sh release-payload/scripts/bootstrap-production.sh
          install -m 0755 scripts/deploy-release.sh release-payload/scripts/deploy-release.sh
          install -m 0755 scripts/preflight-production.sh release-payload/scripts/preflight-production.sh
          install -m 0755 scripts/rollback-release.sh release-payload/scripts/rollback-release.sh
          compose_sha="$(sha256sum release-payload/docker-compose.yml | awk '{print $1}')"
          {
            printf 'RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'BOT_IMAGE=%s\n' "$BOT_IMAGE"
            printf 'COMPOSE_PROJECT=%s\n' "$COMPOSE_PROJECT"
            printf 'COMPOSE_SHA256=%s\n' "$compose_sha"
          } > release-payload/release.manifest

      - name: Prepare trusted fresh staging directory
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          PROJECT_ROOT: ${{ vars.VPS_PROJECT_PATH || '/opt/ytdlbot' }}
          DEPLOY_UPLOAD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: PROJECT_ROOT,DEPLOY_UPLOAD_ID
          script: |
            set -eu
            incoming_root="$PROJECT_ROOT/.incoming"
            staging_dir="$incoming_root/$DEPLOY_UPLOAD_ID"
            test -d "$PROJECT_ROOT"
            test ! -L "$PROJECT_ROOT"
            if test -e "$incoming_root" || test -L "$incoming_root"; then
              test -d "$incoming_root"
              test ! -L "$incoming_root"
            else
              mkdir -m 700 "$incoming_root"
            fi
            test "$(stat -c '%u' "$incoming_root")" = "$(id -u)"
            test ! -e "$staging_dir"
            test ! -L "$staging_dir"
            mkdir -m 700 "$staging_dir"
            test "$(stat -c '%u' "$staging_dir")" = "$(id -u)"
            test "$(readlink -f "$staging_dir")" = "$staging_dir"

      - name: Upload only allowlisted release files
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: appleboy/scp-action@8a92fcdb1eb4ffbf538b2fa286739760aac8a95b
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: "release-payload/docker-compose.yml,release-payload/release.manifest,release-payload/scripts/bootstrap-migrate-production.sh,release-payload/scripts/bootstrap-production.sh,release-payload/scripts/deploy-release.sh,release-payload/scripts/preflight-production.sh,release-payload/scripts/rollback-release.sh"
          target: "${{ vars.VPS_PROJECT_PATH || '/opt/ytdlbot' }}/.incoming/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1
          rm: false

      - name: Activate immutable release over verified SSH
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          PROJECT_ROOT: ${{ vars.VPS_PROJECT_PATH || '/opt/ytdlbot' }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_BRANCH_SHA: ${{ steps.freshness.outputs.branch_sha }}
          BOT_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT || 'ytdlbot' }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || secrets.BASE_URL }}
          DEPLOY_UPLOAD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: PROJECT_ROOT,RELEASE_SHA,EXPECTED_BRANCH_SHA,BOT_IMAGE,COMPOSE_PROJECT,PUBLIC_BASE_URL,DEPLOY_UPLOAD_ID
          script: |
            set -eu
            staging_dir="$PROJECT_ROOT/.incoming/$DEPLOY_UPLOAD_ID"
            releases_root="$PROJECT_ROOT/releases"
            release_dir="$releases_root/$RELEASE_SHA"
            payload_files='docker-compose.yml
            release.manifest
            scripts/bootstrap-migrate-production.sh
            scripts/bootstrap-production.sh
            scripts/deploy-release.sh
            scripts/preflight-production.sh
            scripts/rollback-release.sh'
            expected_files="$(printf '%s\n' ./docker-compose.yml ./release.manifest ./scripts/bootstrap-migrate-production.sh ./scripts/bootstrap-production.sh ./scripts/deploy-release.sh ./scripts/preflight-production.sh ./scripts/rollback-release.sh | LC_ALL=C sort)"
            verify_release_payload() {
              payload_root=$1
              test -d "$payload_root"
              test ! -L "$payload_root"
              test "$(stat -c '%u' "$payload_root")" = "$(id -u)"
              test "$(readlink -f "$payload_root")" = "$payload_root"
              actual_files="$(cd "$payload_root" && find . -type f -print | LC_ALL=C sort)"
              test "$actual_files" = "$expected_files"
              test -z "$(find "$payload_root" -type l -print -quit)"
              test "$(stat -c '%u' "$payload_root/scripts")" = "$(id -u)"
              for relative_path in $payload_files; do
                test "$(stat -c '%u' "$payload_root/$relative_path")" = "$(id -u)"
              done
              test "$(grep -Fxc "RELEASE_SHA=$RELEASE_SHA" "$payload_root/release.manifest")" = 1
              test "$(grep -Fxc "BOT_IMAGE=$BOT_IMAGE" "$payload_root/release.manifest")" = 1
              test "$(grep -Fxc "COMPOSE_PROJECT=$COMPOSE_PROJECT" "$payload_root/release.manifest")" = 1
              test "$(grep -Ec '^COMPOSE_SHA256=[0-9a-f]{64}$' "$payload_root/release.manifest")" = 1
              expected_compose_sha="$(sed -n 's/^COMPOSE_SHA256=//p' "$payload_root/release.manifest")"
              test "$(sha256sum "$payload_root/docker-compose.yml" | awk '{print $1}')" = "$expected_compose_sha"
            }
            verify_release_payload "$staging_dir"
            if test -e "$releases_root" || test -L "$releases_root"; then
              test -d "$releases_root"
              test ! -L "$releases_root"
            else
              mkdir -m 700 "$releases_root"
            fi
            test "$(stat -c '%u' "$releases_root")" = "$(id -u)"
            if test -e "$release_dir" || test -L "$release_dir"; then
              verify_release_payload "$release_dir"
              for relative_path in $payload_files; do
                staging_sha="$(sha256sum "$staging_dir/$relative_path" | awk '{print $1}')"
                release_sha="$(sha256sum "$release_dir/$relative_path" | awk '{print $1}')"
                if test "$staging_sha" != "$release_sha"; then
                  printf 'Existing immutable release payload differs: %s\n' "$relative_path" >&2
                  exit 1
                fi
              done
            else
              test ! -L "$release_dir"
              mv "$staging_dir" "$release_dir"
            fi
            sh "$release_dir/scripts/deploy-release.sh"
