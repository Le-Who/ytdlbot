minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-prose-comments
        name: Check code comments
        language: system
        pass_filenames: false
        always_run: true
        entry: python scripts/check-code-comments.py
      - id: mypy
        name: mypy (Linux)
        language: system
        types: [python]
        pass_filenames: false
        entry: python -m mypy app/ --no-incremental --platform linux
      - id: mypy-windows
        name: mypy (Windows)
        language: system
        types: [python]
        pass_filenames: false
        entry: python -m mypy app/ --no-incremental --platform win32

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
